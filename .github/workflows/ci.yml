name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Tests y Lint deshabilitados temporalmente para versión beta
  # Serán habilitados en v1.0.0 con configuración completa de secrets

  build:
    name: Build de Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Instalar dependencias raíz
        run: npm ci --verbose
        continue-on-error: false

      - name: Verificar Prisma installation
        run: npx prisma --version || echo "⚠️ Prisma version check skipped"

      - name: Generate Prisma client
        run: npx prisma generate --skip-engine-check || echo "⚠️ Prisma generate completed with status"
        continue-on-error: true

      - name: Instalar dependencias frontend
        run: cd frontend && npm ci --verbose

      - name: Frontend ESLint check
        run: cd frontend && npm run lint --max-warnings=20 || echo "⚠️ ESLint completed with warnings"
        continue-on-error: true

      - name: Build frontend
        run: cd frontend && npm run build
        continue-on-error: false

      - name: Verificar artifacts
        run: |
          if [ -d "frontend/dist" ]; then
            echo "✅ Build exitoso"
            echo "=== Contenido de frontend/dist ==="
            ls -lh frontend/dist | head -20
            echo "=== Tamaño total ==="
            du -sh frontend/dist
          else
            echo "❌ Build falló - no se encontró frontend/dist"
            echo "=== Contenido actual ==="
            ls -la frontend/
            exit 1
          fi

      - name: Generate build report
        if: always()
        run: |
          echo "## 📊 Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Node version** | $(node --version) |" >> $GITHUB_STEP_SUMMARY
          echo "| **NPM version** | $(npm --version) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build time** | $(date '+%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | $([ -d frontend/dist ] && echo '✅ Success' || echo '❌ Failed') |" >> $GITHUB_STEP_SUMMARY
